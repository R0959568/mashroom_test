services:
  backend:
    build: .
    ports:
      - "8000:8000"
  frontend:
    build: .
    command: streamlit run frontend/app.py --server.port 8501 --server.address 0.0.0.0
    environment:
      MUSHROOM_API_URL: http://backend:8000
    ports:
      - "8501:8501"
    depends_on:
      - backend
